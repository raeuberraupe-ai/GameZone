<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Slot Machine 🎰</title>
  <link rel="stylesheet" href="../style.css"/>
  <style>
    body{background:#0f0f1a;}
    .slot-machine{background:linear-gradient(145deg,#1a1a2e,#16213e);border:3px solid #e94560;border-radius:24px;padding:30px 40px;text-align:center;max-width:420px;width:100%;}
    .reels{display:flex;gap:12px;justify-content:center;margin:20px 0;}
    .reel{width:90px;height:90px;background:#0a0a18;border-radius:12px;border:2px solid #2a2a4a;
      display:flex;align-items:center;justify-content:center;font-size:3.5rem;
      transition:transform 0.1s;}
    .reel.spinning{animation:spin 0.1s linear infinite;}
    @keyframes spin{0%{transform:translateY(-4px)}50%{transform:translateY(4px)}100%{transform:translateY(-4px)}}
    .coins{font-size:1.3rem;color:#ffd700;margin-bottom:10px;}
    .bet-row{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:16px;}
    .bet-btn{padding:8px 16px;background:#2a2a4a;color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:1rem;}
    .bet-btn:hover{background:#3a3a5a;}
    #spinBtn{padding:14px 50px;background:#e94560;color:#fff;border:none;border-radius:25px;font-size:1.2rem;font-weight:bold;cursor:pointer;transition:background 0.2s,transform 0.1s;}
    #spinBtn:hover:not(:disabled){background:#c73652;transform:scale(1.05);}
    #spinBtn:disabled{background:#555;cursor:not-allowed;}
    #result{font-size:1.3rem;font-weight:bold;min-height:36px;margin:12px 0;}
    .paytable{font-size:0.85rem;color:#666;margin-top:14px;line-height:1.8;}
  </style>
</head>
<body class="game-page">
  <a href="../index.html" class="back-btn">← Zurück zur Startseite</a>
  <h1>🎰 Slot Machine</h1>
  <div class="slot-machine">
    <div class="coins">💰 Münzen: <span id="coins">100</span></div>
    <div class="reels">
      <div class="reel" id="r0">🍒</div>
      <div class="reel" id="r1">🍋</div>
      <div class="reel" id="r2">🍊</div>
    </div>
    <div id="result"></div>
    <div class="bet-row">
      <span style="color:#aaa">Einsatz:</span>
      <button class="bet-btn" onclick="changeBet(-5)">-</button>
      <span id="bet" style="color:#fff;font-weight:bold;font-size:1.1rem;min-width:30px;text-align:center;">10</span>
      <button class="bet-btn" onclick="changeBet(5)">+</button>
    </div>
    <button id="spinBtn" onclick="spin()">🎰 Drehen!</button>
    <div class="paytable">
      🍒🍒🍒 = 3x | 🍋🍋🍋 = 5x | 🍊🍊🍊 = 5x<br>
      🍇🍇🍇 = 8x | ⭐⭐⭐ = 10x | 💎💎💎 = 20x<br>
      2 gleiche = 1.5x Einsatz zurück
    </div>
  </div>

  <script>
    const SYMBOLS=['🍒','🍒','🍒','🍋','🍋','🍊','🍊','🍇','⭐','💎'];
    const MULT={'🍒':3,'🍋':5,'🍊':5,'🍇':8,'⭐':10,'💎':20};
    let coins=100, bet=10, spinning=false;

    function changeBet(d){ if(spinning) return; bet=Math.max(5,Math.min(coins,bet+d)); document.getElementById('bet').textContent=bet; }

    function spin(){
      if(spinning||coins<bet) return;
      spinning=true; coins-=bet;
      document.getElementById('coins').textContent=coins;
      document.getElementById('result').textContent='';
      document.getElementById('spinBtn').disabled=true;
      const reels=[0,1,2].map(i=>document.getElementById('r'+i));
      reels.forEach(r=>r.classList.add('spinning'));

      const results=SYMBOLS.map(()=>SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]);
      // Actually pick final
      const finals=[SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)],SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)],SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]];

      let delays=[600,900,1200];
      finals.forEach((sym,i)=>{
        const interval=setInterval(()=>reels[i].textContent=SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)],80);
        setTimeout(()=>{ clearInterval(interval); reels[i].textContent=sym; reels[i].classList.remove('spinning');
          if(i===2){ evaluate(finals); }
        },delays[i]);
      });
    }

    function evaluate(f){
      const res=document.getElementById('result');
      let win=0;
      if(f[0]===f[1]&&f[1]===f[2]){ win=bet*MULT[f[0]]; res.textContent=`🏆 JACKPOT! +${win} Münzen!`; res.style.color='#ffd700'; }
      else if(f[0]===f[1]||f[1]===f[2]||f[0]===f[2]){ win=Math.floor(bet*1.5); res.textContent=`✨ Zwei gleiche! +${win} Münzen`; res.style.color='#00ff88'; }
      else{ res.textContent='😔 Kein Gewinn'; res.style.color='#e94560'; }
      coins+=win;
      document.getElementById('coins').textContent=coins;
      if(coins<=0){ res.textContent='💸 Bankrott! Neustart...'; setTimeout(()=>{coins=100;document.getElementById('coins').textContent=100;},1500); }
      spinning=false;
      document.getElementById('spinBtn').disabled=false;
    }
  </script>
</body>
</html>
