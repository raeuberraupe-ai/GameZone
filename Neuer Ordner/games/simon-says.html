<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simon Says 🎵</title>
  <link rel="stylesheet" href="../style.css"/>
  <style>
    body{background:#0f0f1a;}
    .simon-grid{display:grid;grid-template-columns:repeat(2,140px);gap:12px;margin:24px 0;}
    .simon-btn{width:140px;height:140px;border-radius:20px;border:none;cursor:pointer;font-size:3rem;
      transition:transform 0.1s,filter 0.1s;filter:brightness(0.5);}
    .simon-btn.active{filter:brightness(1.3);transform:scale(1.06);}
    .simon-btn:hover:not(:disabled){filter:brightness(0.8);}
    #s0{background:#e94560;} #s1{background:#00d4ff;} #s2{background:#ffd700;} #s3{background:#00ff88;}
    #status{font-size:1.2rem;color:#aaa;margin:10px 0;min-height:30px;}
    #level{font-size:1.5rem;color:#e94560;font-weight:bold;margin-bottom:6px;}
    #startBtn{padding:12px 36px;background:#e94560;color:#fff;border:none;border-radius:25px;font-size:1.1rem;font-weight:bold;cursor:pointer;}
    #startBtn:hover{background:#c73652;}
  </style>
</head>
<body class="game-page">
  <a href="../index.html" class="back-btn">← Zurück zur Startseite</a>
  <h1>🎵 Simon Says</h1>
  <div id="level">Level: 0</div>
  <div id="status">Drücke Start!</div>
  <div class="simon-grid">
    <button class="simon-btn" id="s0" onclick="playerClick(0)">🔴</button>
    <button class="simon-btn" id="s1" onclick="playerClick(1)">🔵</button>
    <button class="simon-btn" id="s2" onclick="playerClick(2)">🟡</button>
    <button class="simon-btn" id="s3" onclick="playerClick(3)">🟢</button>
  </div>
  <button id="startBtn" onclick="startGame()">Starten!</button>

  <script>
    let sequence=[], playerSeq=[], playing=false, accepting=false, level=0, hs=0;

    function flash(i, dur=400){
      return new Promise(res=>{
        const btn=document.getElementById('s'+i);
        btn.classList.add('active');
        setTimeout(()=>{ btn.classList.remove('active'); setTimeout(res,100); },dur);
      });
    }

    async function playSequence(){
      accepting=false;
      setBtns(true);
      document.getElementById('status').textContent='Schau zu...';
      for(const i of sequence){ await flash(i,500); await new Promise(r=>setTimeout(r,150)); }
      accepting=true;
      setBtns(false);
      playerSeq=[];
      document.getElementById('status').textContent='Deine Runde!';
    }

    function setBtns(disabled){ [0,1,2,3].forEach(i=>document.getElementById('s'+i).disabled=disabled); }

    async function startGame(){
      sequence=[]; level=0; playing=true;
      document.getElementById('startBtn').style.display='none';
      await nextRound();
    }

    async function nextRound(){
      level++;
      document.getElementById('level').textContent='Level: '+level;
      sequence.push(Math.floor(Math.random()*4));
      await new Promise(r=>setTimeout(r,600));
      await playSequence();
    }

    async function playerClick(i){
      if(!accepting) return;
      await flash(i,200);
      playerSeq.push(i);
      const idx=playerSeq.length-1;
      if(playerSeq[idx]!==sequence[idx]){
        accepting=false; setBtns(true);
        document.getElementById('status').textContent='❌ Falsch! Du hast Level '+level+' erreicht.';
        document.getElementById('level').textContent='Level: '+level;
        document.getElementById('startBtn').style.display='inline-block';
        document.getElementById('startBtn').textContent='Nochmal!';
        playing=false; return;
      }
      if(playerSeq.length===sequence.length) await nextRound();
    }
  </script>
</body>
</html>
