<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2048 🔢</title>
  <link rel="stylesheet" href="../style.css"/>
  <style>
    body{background:#0f0f1a;}
    .info-row{display:flex;gap:20px;margin-bottom:14px;flex-wrap:wrap;justify-content:center;}
    .score-box{background:#1a1a2e;border-radius:10px;padding:10px 20px;text-align:center;min-width:90px;}
    .score-box .label{font-size:0.8rem;color:#aaa;text-transform:uppercase;}
    .score-box .val{font-size:1.4rem;font-weight:bold;color:#fff;}
    #grid{display:grid;grid-template-columns:repeat(4,90px);gap:8px;background:#1a1a2e;padding:10px;border-radius:12px;}
    .tile{width:90px;height:90px;border-radius:8px;display:flex;align-items:center;justify-content:center;
      font-size:1.6rem;font-weight:bold;color:#fff;transition:all 0.1s;}
    .t0{background:#0a0a18;}
    .t2{background:#3a3a5a;color:#fff;}
    .t4{background:#4a3a6a;}
    .t8{background:#e94560;}
    .t16{background:#ff6b35;}
    .t32{background:#ff8c00;}
    .t64{background:#ffa500;}
    .t128{background:#ffd700;color:#333;}
    .t256{background:#00d4ff;color:#333;}
    .t512{background:#00ff88;color:#333;}
    .t1024{background:#a855f7;}
    .t2048{background:#fff;color:#333;font-size:1.3rem;}
    #msg{font-size:1.4rem;font-weight:bold;margin:14px 0;min-height:36px;}
    #restartBtn{padding:10px 28px;background:#e94560;color:#fff;border:none;border-radius:20px;font-size:1rem;font-weight:bold;cursor:pointer;}
    #restartBtn:hover{background:#c73652;}
  </style>
</head>
<body class="game-page">
  <a href="../index.html" class="back-btn">← Zurück zur Startseite</a>
  <h1>🔢 2048</h1>
  <div class="info-row">
    <div class="score-box"><div class="label">Score</div><div class="val" id="score">0</div></div>
    <div class="score-box"><div class="label">Highscore</div><div class="val" id="hs">0</div></div>
  </div>
  <div id="grid"></div>
  <div id="msg"></div>
  <button id="restartBtn" onclick="initGame()">Neustart</button>
  <p class="instructions">⬅️➡️⬆️⬇️ Pfeiltasten zum Schieben</p>

  <script>
    let board, score, hs=0, won=false;

    function initGame(){
      board=Array.from({length:4},()=>Array(4).fill(0));
      score=0; won=false;
      document.getElementById('score').textContent=0;
      document.getElementById('msg').textContent='';
      addTile(); addTile(); render();
    }

    function addTile(){
      const empty=[];
      for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(!board[r][c]) empty.push([r,c]);
      if(!empty.length) return;
      const [r,c]=empty[Math.floor(Math.random()*empty.length)];
      board[r][c]=Math.random()<0.9?2:4;
    }

    function slide(row){
      let arr=row.filter(v=>v); let merged=false;
      for(let i=0;i<arr.length-1;i++){
        if(arr[i]===arr[i+1]&&!merged){ arr[i]*=2; score+=arr[i]; arr.splice(i+1,1); merged=true; }
        else merged=false;
      }
      while(arr.length<4) arr.push(0);
      return arr;
    }

    function move(dir){
      let moved=false;
      const prev=board.map(r=>[...r]);
      if(dir==='left') board=board.map(r=>slide(r));
      if(dir==='right') board=board.map(r=>slide([...r].reverse()).reverse());
      if(dir==='up'||dir==='down'){
        for(let c=0;c<4;c++){
          let col=board.map(r=>r[c]);
          if(dir==='down') col.reverse();
          col=slide(col);
          if(dir==='down') col.reverse();
          board.forEach((r,i)=>r[c]=col[i]);
        }
      }
      moved=JSON.stringify(board)!==JSON.stringify(prev);
      if(moved){ addTile(); document.getElementById('score').textContent=score; if(score>hs){hs=score;document.getElementById('hs').textContent=hs;} }
      render();
      checkEnd();
    }

    function checkEnd(){
      if(board.some(r=>r.includes(2048))&&!won){ won=true; document.getElementById('msg').textContent='🏆 2048 erreicht!'; document.getElementById('msg').style.color='#ffd700'; return; }
      for(let r=0;r<4;r++) for(let c=0;c<4;c++){
        if(!board[r][c]) return;
        if(c<3&&board[r][c]===board[r][c+1]) return;
        if(r<3&&board[r][c]===board[r+1][c]) return;
      }
      document.getElementById('msg').textContent='Game Over!'; document.getElementById('msg').style.color='#e94560';
    }

    function render(){
      const g=document.getElementById('grid'); g.innerHTML='';
      board.forEach(row=>row.forEach(v=>{
        const d=document.createElement('div');
        d.className='tile t'+Math.min(v,2048);
        d.textContent=v||'';
        g.appendChild(d);
      }));
    }

    document.addEventListener('keydown',e=>{
      const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
      if(map[e.key]){e.preventDefault();move(map[e.key]);}
    });

    // Touch support
    let tx,ty;
    document.getElementById('grid').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
    document.getElementById('grid').addEventListener('touchend',e=>{
      const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
      if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left');
      else move(dy>0?'down':'up');
    });

    initGame();
  </script>
</body>
</html>
