<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breakout 🧱</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    body { background: #0f0f1a; }
    #gameCanvas { background: #0a0a18; cursor: none; }
  </style>
</head>
<body class="game-page">
  <a href="../index.html" class="back-btn">← Zurück zur Startseite</a>
  <h1>🧱 Breakout</h1>
  <div class="score-display">Score: <span id="score">0</span> &nbsp;|&nbsp; Leben: <span id="lives">3</span></div>
  <canvas id="gameCanvas" width="600" height="480"></canvas>
  <div id="gameOverMsg" class="game-over-msg" style="display:none;"></div>
  <p class="instructions">🖱️ Maus bewegen zum Steuern | Klicken zum Starten</p>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const msgEl = document.getElementById('gameOverMsg');

    const W = canvas.width, H = canvas.height;
    const ROWS = 5, COLS = 10;
    const BRICK_W = 52, BRICK_H = 18, BRICK_PAD = 4;
    const BRICK_OFFSET_X = 14, BRICK_OFFSET_Y = 50;
    const COLORS = ['#e94560','#ff8c00','#ffd700','#00d4ff','#a855f7'];

    let ball, paddle, bricks, score, lives, started, animId;

    function initGame() {
      ball = { x: W/2, y: H-80, r: 9, vx: 4, vy: -4 };
      paddle = { x: W/2 - 50, y: H-30, w: 100, h: 12 };
      score = 0; lives = 3; started = false;
      scoreEl.textContent = 0; livesEl.textContent = 3;
      msgEl.style.display = 'none';
      bricks = [];
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          bricks.push({ x: BRICK_OFFSET_X + c*(BRICK_W+BRICK_PAD), y: BRICK_OFFSET_Y + r*(BRICK_H+BRICK_PAD), alive: true, color: COLORS[r] });
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w/2));
      if (!started) ball.x = paddle.x + paddle.w/2;
    });

    canvas.addEventListener('click', () => {
      if (!started) { started = true; return; }
      if (msgEl.style.display !== 'none') initGame();
    });

    function loop() {
      ctx.fillStyle = '#0a0a18';
      ctx.fillRect(0, 0, W, H);

      // Bricks
      bricks.forEach(b => {
        if (!b.alive) return;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, BRICK_W, BRICK_H, 4);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(b.x+4, b.y+3, BRICK_W-8, 4);
      });

      // Paddle
      const grad = ctx.createLinearGradient(paddle.x, 0, paddle.x+paddle.w, 0);
      grad.addColorStop(0, '#e94560'); grad.addColorStop(1, '#ff8c00');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();

      // Ball
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (!started) {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '18px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('Klicken zum Starten', W/2, H/2);
        ctx.textAlign = 'left';
        animId = requestAnimationFrame(loop);
        return;
      }

      // Ball movement
      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; }
      if (ball.x + ball.r > W) { ball.x = W-ball.r; ball.vx *= -1; }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; }

      // Paddle collision
      if (ball.y + ball.r > paddle.y && ball.y - ball.r < paddle.y + paddle.h &&
          ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
        ball.vy = -Math.abs(ball.vy);
        const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
        ball.vx = hit * 6;
      }

      // Brick collision
      for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x+ball.r > b.x && ball.x-ball.r < b.x+BRICK_W &&
            ball.y+ball.r > b.y && ball.y-ball.r < b.y+BRICK_H) {
          b.alive = false;
          ball.vy *= -1;
          score += 10;
          scoreEl.textContent = score;
          break;
        }
      }

      // Ball lost
      if (ball.y + ball.r > H) {
        lives--;
        livesEl.textContent = lives;
        if (lives <= 0) {
          msgEl.textContent = 'Game Over! Klicken zum Neustart';
          msgEl.style.display = 'block';
          return;
        }
        ball = { x: paddle.x+paddle.w/2, y: H-80, r: 9, vx: 4, vy: -4 };
        started = false;
      }

      // Win
      if (bricks.every(b => !b.alive)) {
        msgEl.textContent = '🏆 Gewonnen! Klicken zum Neustart';
        msgEl.style.display = 'block';
        return;
      }

      animId = requestAnimationFrame(loop);
    }

    initGame();
  </script>
</body>
</html>
