<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory 🃏</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    body { background: #0f0f1a; }
    .memory-info {
      display: flex; gap: 40px; font-size: 1.2rem;
      margin-bottom: 16px; color: #fff;
    }
    .memory-info span { color: #e94560; font-weight: bold; }
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 100px);
      gap: 12px;
    }
    .card {
      width: 100px; height: 100px;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card-front, .card-back {
      position: absolute; width: 100%; height: 100%;
      border-radius: 12px;
      backface-visibility: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .card-front {
      background: linear-gradient(135deg, #1a1a2e, #2a2a4a);
      border: 2px solid #3a3a5a;
      font-size: 2.5rem;
    }
    .card-back {
      background: linear-gradient(135deg, #16213e, #1a1a2e);
      border: 2px solid #e94560;
      font-size: 2.5rem;
      transform: rotateY(180deg);
    }
    .card.matched .card-back {
      border-color: #00ff88;
      background: linear-gradient(135deg, #0a2a1a, #0f3a22);
    }
    #winMsg {
      font-size: 1.6rem; color: #00ff88;
      margin-top: 20px; font-weight: bold; display: none;
    }
    #restartBtn {
      margin-top: 14px; padding: 10px 28px;
      background: #e94560; color: #fff;
      border: none; border-radius: 20px;
      font-size: 1rem; font-weight: bold;
      cursor: pointer; display: none;
    }
    #restartBtn:hover { background: #c73652; }
  </style>
</head>
<body class="game-page">
  <a href="../index.html" class="back-btn">← Zurück zur Startseite</a>
  <h1>🃏 Memory</h1>
  <div class="memory-info">
    <div>Züge: <span id="moves">0</span></div>
    <div>Paare: <span id="pairs">0</span> / 8</div>
    <div>Zeit: <span id="timer">0</span>s</div>
  </div>
  <div class="memory-grid" id="grid"></div>
  <div id="winMsg">🏆 Gewonnen!</div>
  <button id="restartBtn" onclick="initGame()">Nochmal spielen</button>

  <script>
    const EMOJIS = ['🍕','🎸','🌈','🦊','🚀','🎮','🍦','💎'];
    let flipped = [], matched = 0, moves = 0, locked = false, timerInterval, seconds = 0;

    function initGame() {
      clearInterval(timerInterval);
      seconds = 0; moves = 0; matched = 0; flipped = []; locked = false;
      document.getElementById('moves').textContent = 0;
      document.getElementById('pairs').textContent = 0;
      document.getElementById('timer').textContent = 0;
      document.getElementById('winMsg').style.display = 'none';
      document.getElementById('restartBtn').style.display = 'none';

      const cards = [...EMOJIS, ...EMOJIS].sort(() => Math.random() - 0.5);
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      cards.forEach((emoji, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.emoji = emoji;
        card.dataset.index = i;
        card.innerHTML = `<div class="card-front"></div><div class="card-back">${emoji}</div>`;
        card.addEventListener('click', () => flipCard(card));
        grid.appendChild(card);
      });

      timerInterval = setInterval(() => {
        seconds++;
        document.getElementById('timer').textContent = seconds;
      }, 1000);
    }

    function flipCard(card) {
      if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped');
      flipped.push(card);

      if (flipped.length === 2) {
        locked = true;
        moves++;
        document.getElementById('moves').textContent = moves;
        const [a, b] = flipped;
        if (a.dataset.emoji === b.dataset.emoji) {
          a.classList.add('matched'); b.classList.add('matched');
          matched++;
          document.getElementById('pairs').textContent = matched;
          flipped = []; locked = false;
          if (matched === 8) {
            clearInterval(timerInterval);
            document.getElementById('winMsg').style.display = 'block';
            document.getElementById('restartBtn').style.display = 'inline-block';
          }
        } else {
          setTimeout(() => {
            a.classList.remove('flipped'); b.classList.remove('flipped');
            flipped = []; locked = false;
          }, 900);
        }
      }
    }

    initGame();
  </script>
</body>
</html>
